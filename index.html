<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1>Calculadora de IMC</h1>
        <p class="subtitle">Descubra o seu Índice de Massa Corporal</p>

        <form id="imc-form">
            <div class="input-group">
                <label for="peso">Peso (kg)</label>
                <input type="number" id="peso" step="0.1" placeholder="Ex: 70.0" required>
            </div>

            <div class="input-group">
                <label for="altura">Altura (m)</label>
                <input type="number" id="altura" step="0.01" placeholder="Ex: 1.75" required>
            </div>

            <button type="submit" id="btn-calcular">Calcular</button>
        </form>

        <div id="resultado" class="hidden">
            <h2>Resultado</h2>
            <p id="valor-imc"></p>
            <p id="classificacao"></p>
        </div>
    </main>

    <script src="scripts.js"></script>
</body>
</html>
